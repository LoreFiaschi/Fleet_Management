# Rainflow cells with the Markov bound (linear row mu <= epsilon tau), repair law ardinf
F: 3
M: 1
L: 2
H: [2, 3]
model: rainflow
bound_method: markov
repair_model: ardinf
tau: 1.0
epsilon: [0.30, 0.35]
rho: [0.6, 0.5]
mu_0: [0.05, 0.08]
replacement_mu: 0.02
mu: [[0.10], [0.12]]
C_M: 1.0
C_R: [2.0, 1.5]
C_rep: [6.0, 5.0]
C_D: 0.5
verbose: 0
mip_gap: 0
time_limit: 60
gurobi_params: {Threads: 1}
