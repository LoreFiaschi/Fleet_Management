# Matched numerical comparison case: ARD1.
# The companion matched_mixed_ardinf.yaml differs only in repair_model.
F: 2
M: 1
L: 2
H: [2, 3]

component_names: [Battery, Motor Insulation]
model: [gamma, rainflow]
bound_method: [cantelli, markov]
repair_model: [ard1, ard1]

tau: [0.8, 0.8]
epsilon: [0.2, 0.2]
rho: 0.5

mu_0:
  - [0.020, 0.010]
  - [0.015, 0.010]
v_0: 0.00005
replacement_mu:
  - [0.001, 0.000]
  - [0.001, 0.000]
replacement_v: 0.0

# Operating profiles have length H2=3; initialization profiles have H1=2.
mu:
  -
    - [[0.020, 0.020, 0.020]]
    - [[0.010, 0.010, 0.010]]
  -
    - [[0.020, 0.020, 0.020]]
    - [[0.010, 0.010, 0.010]]
mu_trans:
  -
    - [[0.050, 0.050]]
    - [[0.020, 0.020]]
  -
    - [[0.050, 0.050]]
    - [[0.020, 0.020]]
v: 0.00010
v_trans: 0.00015

# Rainflow entries are inert placeholders in the rectangular Gamma arrays.
gamma_beta:
  -
    - [[20.0, 15.0, 12.0]]
    - [[10.0, 10.0, 10.0]]
  -
    - [[18.0, 14.0, 10.0]]
    - [[10.0, 10.0, 10.0]]
gamma_beta_trans:
  -
    - [[16.0, 10.0]]
    - [[10.0, 10.0]]
  -
    - [[15.0, 10.0]]
    - [[10.0, 10.0]]
gamma_beta_bound: [10.0, 10.0]
gamma_calibration_method: repeated_increment
gamma_beta_0:
  - [14.0, 10.0]
  - [12.0, 10.0]
gamma_beta_new: 10.0

C_M: 0.05
C_R: 0.0
C_D: 20.0
C_rep: 5.0
C_P: 0.0

allow_replacement: true
replacement_as_new: true
mip_gap: 0.0
verbose: 0

validation:
  mode: both
  repetitions: 100000
  random_seed: 20260908
  confidence_level: 0.95
  batch_size: 20000
