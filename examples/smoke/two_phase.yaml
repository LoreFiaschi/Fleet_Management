# Covers: a transitory profile mu_trans that differs from the operating profile mu, H = [3, 4].
F: 3
M: 1
L: 2
H: [3, 4]
component_names: [Wheelset, Axle]

model: [gaussian, inverse_gaussian]
repair_model: ardinf

tau: 1.0
epsilon: 0.05
rho: 0.8

mu_0: 0.15
v_0: 0.001
replacement_mu: 0.04
replacement_v: 0.0001

mu: [[0.05], [0.05]]                                  # profile (L, M)
mu_trans: [[[0.10, 0.10, 0.10]], [[0.08, 0.08, 0.08]]]  # profile (L, M, H1)
v: 0.0001
eta: 0.2

C_M: 1.0
C_R: 2.0
C_rep: 10.0
C_D: 1.0

verbose: 0
mip_gap: 0.01
time_limit: 120
