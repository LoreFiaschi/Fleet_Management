# Covers: the input of the operating-horizon sweep over H2 = 2, 3, 4 with H1 = 2; every profile is a scalar, so it fits every H2.
F: 3
M: 1
L: 2
H: [2, 3]
component_names: [Wheelset, Axle]

model: [gaussian, inverse_gaussian]
repair_model: ardinf

tau: 1.0
epsilon: 0.05
rho: 0.8

mu_0: 0.15
v_0: 0.001
replacement_mu: 0.04
replacement_v: 0.0001

mu: 0.06
v: 0.0001
eta: 0.15

C_M: 1.0
C_R: 2.0
C_rep: 10.0
C_D: 1.0

verbose: 0
mip_gap: 0.01
time_limit: 120
