# One-hour, bound-focused tangent-Cantelli experiment.
# Physical inputs match the earlier L2 exact/tangent runs so that changes in
# solver progress can be attributed to the formulation and search settings.
F: 4
M: 2
L: 2
H: [4, 12]

component_names:
  - Traction battery
  - Motor insulation

model:
  - gamma
  - rainflow

bound_method:
  - cantelli
  - cantelli

repair_model:
  - ardinf
  - ardinf

tau: 0.6
epsilon: 0.1
rho: 0.5
mu_0: 0.0
v_0: 0.0
replacement_mu: 0.0
replacement_v: 0.0

# Mission order: [line 161 weekly duty, line 162 weekly duty].
mu: [0.03, 0.02]
mu_trans: [0.03, 0.02]
v: [0.0003, 0.0002]
v_trans: [0.0003, 0.0002]

gamma_beta: 20.0
gamma_beta_trans: 20.0
gamma_beta_bound: 10.0
gamma_beta_0: 20.0
gamma_beta_new: 20.0
gamma_calibration_method: repeated_increment

C_M: 1.0
C_R: 0.5
C_D: 2.0
C_rep: 0.2

allow_replacement: false
objective_mode: operating_average
reliability_impl: tangent
tangent_ref: 0.32

mip_gap: 0.05
time_limit: 3600
verbose: 1
gurobi_params:
  Threads: 32
  Seed: 1
  MIPFocus: 3
  Heuristics: 0.02
  Symmetry: 2
  Cuts: 2
