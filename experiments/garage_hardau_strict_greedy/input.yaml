# Reduced Garage-Hardau-inspired feasibility application.
#
# This is a synthetic scaling case, not a calibrated VBZ operational data set.
# It halves the published build-only fleet/mission dimensions and adds four
# representative component types. One period represents one week: four weeks
# initialize the fleet and 48 weeks form the repeatable operating phase.
F: 65
M: 13
L: 4
H: [4, 48]

component_names:
  - Tires
  - Traction battery
  - Converters
  - Motor insulation

model: [gamma, gamma, rainflow, rainflow]
bound_method: [cantelli, cantelli, cantelli, cantelli]
repair_model: [ardinf, ardinf, ardinf, ardinf]

# Strict safety configuration requested for the final experiments.
tau: 1.0
epsilon: 0.0001
rho: [0.5, 0.5, 0.5, 0.5]

# Moderately non-pristine but initially reliable synthetic fleet.
mu_0: [0.20, 0.20, 0.20, 0.20]
v_0: [0.0, 0.0, 0.000005, 0.000005]
replacement_mu: 0.0
replacement_v: 0.0

# Broadcastable illustrative weekly mission increments. The rainflow variance
# is deliberately below the one-step epsilon=1e-4 Cantelli limit; the original
# build-only value 0.0002 is infeasible even from a pristine state.
mu: 0.02
mu_trans: 0.02
v: 0.00002
v_trans: 0.00002

gamma_beta: 20.0
gamma_beta_trans: 20.0
gamma_beta_bound: 10.0
gamma_beta_0: 20.0
gamma_beta_new: 20.0
gamma_calibration_method: repeated_increment

# Component-specific illustrative costs.
C_M: [1.0, 1.2, 1.1, 1.3]
C_R: [0.5, 0.8, 0.6, 0.7]
C_D: 2.0
C_rep: [4.0, 7.0, 5.0, 6.0]

allow_replacement: true
objective_mode: operating_average

# Safe linear inner approximation; removes the quadratic reliability rows.
reliability_impl: tangent
tangent_ref: 0.32

mip_gap: 0.05
time_limit: 54000
verbose: 1
progress_interval_seconds: 30
relaxation_warm_start: false
relaxation_time_limit: 1800

gurobi_params:
  Threads: 32
  Seed: 1
  MIPFocus: 1
  Heuristics: 0.2
  Symmetry: 2
  Cuts: 2

