# Horizon sensitivity for a heterogeneous, initially damaged fleet.
F: 4
M: 2
L: 2
H: [2, 24]

component_names:
  - Traction battery
  - Motor insulation

model: [gamma, rainflow]
bound_method: [cantelli, cantelli]
repair_model: [ardinf, ardinf]

tau: [1.0, 1.0]
epsilon: [0.0001, 0.0001]
rho: [0.5, 0.5]

# Rows are vehicles; columns are [Gamma battery, rainflow insulation].
# Two vehicles can initially serve the missions while the two most damaged
# vehicles enter the depot. This makes the preparation horizon operationally
# meaningful without making every vehicle initially unusable.
mu_0:
  - [0.10, 0.20]
  - [0.15, 0.35]
  - [0.35, 0.55]
  - [0.45, 0.65]

# The Gamma-column entries are placeholders; its variance follows from its
# shape/rate parameters. Rainflow uses the second column.
v_0:
  - [0.0, 0.00001]
  - [0.0, 0.00001]
  - [0.0, 0.00001]
  - [0.0, 0.00001]

replacement_mu: [0.0, 0.0]
replacement_v: [0.0, 0.0]

# Mission order: [line 161 weekly duty, line 162 weekly duty].
mu: [0.03, 0.02]
mu_trans: [0.03, 0.02]
v: [0.00002, 0.000015]
v_trans: [0.00002, 0.000015]

gamma_beta: 20.0
gamma_beta_trans: 20.0
gamma_beta_bound: 10.0
gamma_beta_0: 20.0
gamma_beta_new: 20.0
gamma_calibration_method: repeated_increment

C_M: [1.0, 1.2]
C_R: [0.5, 0.8]
C_D: 2.0
C_rep: [4.0, 7.0]

allow_replacement: false
objective_mode: operating_average
evaluation_horizon: 52

reliability_impl: tangent
tangent_ref: 0.32

mip_gap: 0.05
time_limit: 1500
verbose: 1
progress_interval_seconds: 5

relaxation_warm_start: true
relaxation_time_limit: 120

gurobi_params:
  Threads: 32
  Seed: 1
  MIPFocus: 3
  Heuristics: 0.02
  Symmetry: 2
  Cuts: 2
