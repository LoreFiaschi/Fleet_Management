      ard1_shape_latch_big_m_dynamics: 0
    general_constraints: {}
    variable_total: 624
    linear_constraint_total: 9384
    general_constraint_total: 0
  known_subtotal:
    variables: 6292
    linear_constraints: 10112
    general_constraints: 0
    quadratic_constraints: 0
  interpretation: For a uniform Gamma fleet the known subtotal should equal the actual
    Gurobi totals. For a mixed fleet, remaining variables and constraints are contributed
    by non-Gamma degradation blocks. Gamma dynamics use two bounded linear Big-M rows
    per conditional equality and therefore contribute no indicator constraints.
  actual_gurobi_model:
    variables: 7540
    continuous_variables: 4420
    integer_variables: 3120
    binary_variables: 3120
    linear_constraints: 12632
    general_constraints: 3744
    indicator_constraints: 3744
    quadratic_constraints: 0
    nonzeros: 35496
  comparison:
    known_subtotal_matches_actual: false
    non_gamma_remainder:
      variables: 1248
      linear_constraints: 2520
      general_constraints: 3744
      quadratic_constraints: 0
    interpretation: A zero remainder is expected for a uniform Gamma fleet. Positive
      mixed-fleet remainders are variables and constraints belonging to the other
      degradation blocks.
  big_m_implementation:
    conditional_equalities: 3744
    linear_rows: 7488
    minimum_coefficient: 0.01
    maximum_coefficient: 3.662305762487194
    encoding: residual = lhs - rhs; active binary b
    upper_row: residual <= M_upper * (1 - b)
    lower_row: residual >= -M_lower * (1 - b)
    M_upper: max(0, upper bound on lhs - rhs)
    M_lower: max(0, minus lower bound on lhs - rhs)
    bound_strategy: time_dependent_reachable
