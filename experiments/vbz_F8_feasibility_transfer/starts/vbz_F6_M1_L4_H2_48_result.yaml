gamma_formulation:
  dimensions:
    F: 6
    M: 1
    L: 4
    T: 52
  gamma_cells: 12
  gamma_ard1_cells: 0
  uniform_gamma: false
  allow_replacement: false
  definitions:
    linear_constraints: Ordinary Gurobi rows reported by Model.NumConstrs.
    general_constraints: Gamma introduces no general constraints after the tight Big-M
      conversion. Nonzero mixed-fleet totals belong to other blocks.
    shared: Variables and rows created once for the complete fleet.
    gamma_attributable: Additional state and cell constraints introduced for Gamma
      cells.
  formulas:
    gamma_shape_variables: Gamma component cells * T
    gamma_ard1_latch_variables: 2 * Gamma ARD1 component cells * T
    gamma_big_m_state_rows: 2 * Gamma component cells * T * (6 + 3*I_replacement)
    gamma_ard1_latch_big_m_rows: 4 * Gamma ARD1 component cells * T * (2 + I_replacement)
    gamma_reliability_rows: Gamma component cells * T
    gamma_repeatability_rows: 2 * Gamma component cells + 2 * Gamma ARD1 component
      cells
    gamma_maintenance_gating_rows: Gamma component cells * T * (2 + I_replacement)
  shared:
    binary_variables:
      assignment_x: 624
      repair_m: 1248
      replacement_r: 0
      no_intervention_nb: 1248
    continuous_variables:
      physical_mean_mu: 1248
